<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pelusitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#f0ebe3;}
:root{
  --cream:#f0ebe3;--cream2:#e8e2d9;--dark:#2c2117;--mid:#4a3828;
  --sand:#d6ccba;--muted:rgba(44,33,23,0.38);--ink:rgba(44,33,23,0.58);--border:rgba(44,33,23,0.1);
}

#mantenimiento{display:none;position:fixed;inset:0;z-index:9999;background:var(--dark);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
.mant-logo-img{height:80px;width:auto;margin-bottom:1.8rem;}
.mant-subtitle{font-family:'Cormorant Garamond',serif;font-size:clamp(16px,4vw,22px);font-weight:300;color:rgba(255,255,255,0.55);letter-spacing:.12em;margin-bottom:2.5rem;line-height:1.6;}
.mant-deco{width:40px;height:1px;background:rgba(255,255,255,0.2);margin:0 auto 2.5rem;}
.mant-wa{display:inline-flex;align-items:center;gap:.6rem;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);padding:12px 22px;border-radius:30px;color:rgba(255,255,255,0.7);font-family:'Jost',sans-serif;font-weight:200;font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:all .25s;}
.mant-wa:hover{background:rgba(255,255,255,0.1);color:#fff;}
.mant-wa svg{width:16px;height:16px;fill:currentColor;flex-shrink:0;}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,0.25);animation:twinkle 3s infinite ease-in-out;}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

#tienda{display:flex;width:100vw;height:100vh;height:100dvh;position:relative;overflow:hidden;flex-direction:column;}
.topbar{flex-shrink:0;padding:.55rem 1rem .45rem;background:var(--cream);border-bottom:0.5px solid var(--border);position:relative;z-index:10;}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:.6rem;}
.brand-block{display:flex;flex-direction:column;gap:1px;}
.brand-logo{height:40px;width:auto;max-width:180px;display:block;object-fit:contain;object-position:left center;}
.brand-info{font-family:'Jost',sans-serif;font-weight:300;font-size:10.5px;letter-spacing:.03em;color:var(--ink);line-height:1.4;}
.brand-info a{color:var(--ink);text-decoration:none;}
.brand-info a:hover{color:var(--dark);}
.topbar-actions{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
.wa-contact-btn{display:inline-flex;align-items:center;gap:.35rem;background:rgba(44,33,23,0.06);border:0.5px solid rgba(44,33,23,0.15);padding:5px 11px;border-radius:20px;color:var(--ink);font-family:'Jost',sans-serif;font-weight:200;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:all .22s;white-space:nowrap;}
.wa-contact-btn:hover{background:rgba(44,33,23,0.11);color:var(--dark);}
.wa-contact-btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0;}
.search-toggle{background:none;border:none;cursor:pointer;padding:4px;color:var(--muted);transition:color .2s;display:flex;align-items:center;flex-shrink:0;}
.search-toggle:hover{color:var(--dark);}
.search-toggle svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.search-bar{display:none;align-items:center;gap:.5rem;margin-top:.45rem;}
.search-bar.open{display:flex;}
.search-input{flex:1;background:rgba(44,33,23,0.07);border:none;border-radius:20px;padding:6px 13px;color:var(--dark);font-family:'Jost',sans-serif;font-weight:300;font-size:13px;outline:none;}
.search-input::placeholder{color:var(--muted);}
.search-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px;line-height:1;}
.search-results{position:absolute;top:100%;left:0;right:0;background:rgba(240,235,227,0.98);backdrop-filter:blur(8px);z-index:19;max-height:50vh;overflow-y:auto;border-bottom:0.5px solid var(--border);box-shadow:0 8px 24px rgba(44,33,23,0.08);}
.sr-item{display:flex;align-items:center;gap:.8rem;padding:.75rem 1.2rem;cursor:pointer;border-bottom:0.5px solid var(--border);transition:background .15s;}
.sr-item:hover{background:rgba(44,33,23,0.04);}
.sr-swatch{width:36px;height:36px;border-radius:6px;flex-shrink:0;background-size:cover;background-position:center;}
.sr-info{flex:1;}
.sr-name{font-family:'Jost',sans-serif;font-weight:300;font-size:13px;color:var(--dark);}
.sr-cat{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:1px;}
.sr-highlight{color:var(--dark);font-weight:400;}
.sr-empty{padding:1.2rem;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.1em;}

.canvas{flex:1;overflow:hidden;position:relative;min-height:0;}
.pages-wrap{position:relative;width:100%;height:100%;min-height:0;}
.pg{
  position:absolute;inset:0;
  display:grid;gap:4px;padding:4px;
  opacity:0;visibility:hidden;
  pointer-events:none;z-index:0;
  transition:opacity 1.35s ease, transform 1.35s ease, filter 1.2s ease;
  transform:scale(1.02);
  filter:blur(0);
}
.pg.is-active{opacity:1;visibility:visible;pointer-events:auto;z-index:2;transform:scale(1);}
.pg.is-leaving{opacity:0;visibility:visible;pointer-events:none;z-index:1;transform:scale(1);}
.pages-wrap.tx-zoom .pg.is-active{transform:scale(1);}
.pages-wrap.tx-zoom .pg.is-leaving{transform:scale(0.98);}
.pages-wrap.tx-zoom .pg:not(.is-active):not(.is-leaving){transform:scale(1.03);}
.pages-wrap.tx-soft .pg.is-leaving{filter:blur(5px);}
.pages-wrap.tx-soft .pg.is-active{filter:blur(0);}

.tile{
  border-radius:6px;overflow:hidden;position:relative;cursor:pointer;
  background:var(--cream2);min-height:0;min-width:0;
  transform:translateZ(0);
}
.tile-empty{border-radius:6px;background:var(--cream);min-height:0;min-width:0;pointer-events:none;transform:translateZ(0);}
.tile .bg,.tile .bg2{
  position:absolute;inset:0;
  transition:opacity 2s ease;
  will-change:opacity;
  background-repeat:no-repeat;
}
.tile .bg{opacity:1;z-index:1;}
.tile .bg2{opacity:0;z-index:2;pointer-events:none;}
/* Grande (2×2): cover, encuadre tipo vitrina */
.tile-hero .bg,.tile-hero .bg2{background-size:cover;background-position:center center;}
.tile-hero.shape-v .bg,.tile-hero.shape-v .bg2{background-position:center 22%;}
/* Chico: cover ajustado (menos margen que contain; caras un poco más arriba) */
.tile-sm .bg,.tile-sm .bg2{background-size:cover;background-position:center center;}
.tile-sm.shape-v .bg,.tile-sm.shape-v .bg2{background-position:center 32%;}
@media (min-width:640px){
  .tile-sm .bg,.tile-sm .bg2{background-size:108% auto;}
  .tile-sm.shape-v .bg,.tile-sm.shape-v .bg2{background-size:auto 108%;}
  .tile-sm.shape-h .bg,.tile-sm.shape-h .bg2{background-size:108% auto;}
}

.lbl{position:absolute;bottom:0;left:0;right:0;padding:.6rem .7rem;background:linear-gradient(to top,rgba(0,0,0,0.55) 0%,transparent 100%);}
.lbl h3{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:300;color:#fff;line-height:1.3;letter-spacing:.04em;}
.lbl span{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,0.45);}
.wa-tag{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.88);font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-family:'Jost',sans-serif;font-weight:300;padding:3px 8px;border-radius:9px;color:#333;opacity:0;transition:opacity .5s;}
.tile.show-wa .wa-tag{opacity:1;}

.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;pointer-events:none;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(44,33,23,0.2);cursor:pointer;pointer-events:all;transition:background .3s,transform .3s;}
.dot.on{background:rgba(44,33,23,0.6);transform:scale(1.25);}

.modal{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal.open{opacity:1;pointer-events:all;}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,0.6);}
.mimg{position:absolute;top:5vh;left:5vw;right:5vw;height:52vh;max-height:520px;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.modal .bg,.mimg .bg{width:100%;height:100%;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#f0ebe3;}
.mcard{position:relative;background:var(--cream);border-radius:18px 18px 0 0;padding:1.4rem 1.3rem 2.5rem;z-index:1;}
.mcat{font-family:'Jost',sans-serif;font-weight:200;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#aaa;margin-bottom:.4rem;}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--dark);margin-bottom:.4rem;letter-spacing:.03em;}
.mdesc{font-family:'Jost',sans-serif;font-weight:300;font-size:13px;color:#888;line-height:1.65;margin-bottom:1.2rem;}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--dark);color:#fff;font-family:'Jost',sans-serif;font-weight:300;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:13px;border-radius:9px;cursor:pointer;text-decoration:none;transition:background .2s;}
.wa-btn:hover{background:var(--mid);}
.wa-btn svg{width:15px;height:15px;fill:currentColor;flex-shrink:0;}
.xbtn{position:absolute;top:1rem;right:1rem;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#999;border:none;}

.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;background:var(--cream);z-index:5;transition:opacity .4s;}
.loading.hidden{opacity:0;pointer-events:none;}
.loading-logo{height:52px;width:auto;}
.loading-bar{width:44px;height:2px;background:rgba(44,33,23,0.1);border-radius:2px;overflow:hidden;}
.loading-bar::after{content:'';display:block;height:100%;width:40%;background:rgba(44,33,23,0.3);border-radius:2px;animation:loadslide 1.1s ease-in-out infinite;}
@keyframes loadslide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.empty-msg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;width:100vw;}
</style>
</head>

<script>
const WA_NUMBER = '59896190003';
const CATALOGO_URL = 'catalogo.json';
const FIXED_PAGES = 3;
const PAGE_AUTO_MS = 12000;
const PAGE_TRANS_MS = 1350;
const TILE_FADE_MS = 2000;
const TILE_FADE_FIRST_MS = 3000;
const TILE_STAGGER_MS = 3800;
const TILE_REST_MS = 12000;
const MAX_SIMULTANEOUS_FADES = 2;
const PAGE_TRANSITIONS = ['fade', 'zoom', 'soft'];

let PRODUCTOS = [];
let curPage = 0;
let totalPages = 0;
let pageAnim = null;
let waAnim = null;
let pageFadeRestartTimer = null;
let pageTransBusy = false;
let simultaneousFades = 0;
const fadeTimersByTile = new Map();
let COLA = []; // cola global de fotos: todas desfilan antes de repetirse

function isLargeSlot(layout, key){
  const s = layout.tiles[key];
  if(key === 'H' || key === 'H2') return true;
  return s.cs >= 2 && s.rs >= 2;
}

function shuffleArr(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Mobile: 2 heroes en diagonal. Layout A: hero izq-arriba + hero der-abajo. Layout B: inverso */
const MOBILE_LAYOUTS = [
  /* A: [GRANDE izq] [sm][sm] / [sm][sm] [GRANDE der] */
  { cols:3, rows:4, areas:`"H H a" "H H b" "c H2 H2" "d H2 H2"`, tiles:{H:{cs:2,rs:2},H2:{cs:2,rs:2},a:{cs:1,rs:1},b:{cs:1,rs:1},c:{cs:1,rs:1},d:{cs:1,rs:1}} },
  /* B: [sm][sm] [GRANDE der] / [GRANDE izq] [sm][sm] */
  { cols:3, rows:4, areas:`"a H H" "b H H" "H2 H2 c" "H2 H2 d"`, tiles:{H:{cs:2,rs:2},H2:{cs:2,rs:2},a:{cs:1,rs:1},b:{cs:1,rs:1},c:{cs:1,rs:1},d:{cs:1,rs:1}} }
];

const DESKTOP_LAYOUTS = [
  /* A puro: hero izq ocupa todo el alto, sin fila abajo */
  { cols:4, rows:2, rowTemplate:`1fr 1fr`, areas:`"H H a b" "H H c d"`, tiles:{H:{cs:2,rs:2},a:{cs:1,rs:1},b:{cs:1,rs:1},c:{cs:1,rs:1},d:{cs:1,rs:1}} },
  /* B: hero der + sm izq + fila sm abajo */
  { cols:4, rows:3, rowTemplate:`2fr 2fr 1.3fr`, areas:`"a b H H" "c d H H" "e f g h"`, tiles:{H:{cs:2,rs:2},a:{cs:1,rs:1},b:{cs:1,rs:1},c:{cs:1,rs:1},d:{cs:1,rs:1},e:{cs:1,rs:1},f:{cs:1,rs:1},g:{cs:1,rs:1},h:{cs:1,rs:1}} },
  /* A con fila abajo: hero izq + sm der + sm abajo */
  { cols:4, rows:3, rowTemplate:`2fr 2fr 1.3fr`, areas:`"H H a b" "H H c d" "e f g h"`, tiles:{H:{cs:2,rs:2},a:{cs:1,rs:1},b:{cs:1,rs:1},c:{cs:1,rs:1},d:{cs:1,rs:1},e:{cs:1,rs:1},f:{cs:1,rs:1},g:{cs:1,rs:1},h:{cs:1,rs:1}} }
];

function isMobile(){ return window.innerWidth < 640; }

function shapeOf(prod){
  if(!prod || !prod.w || !prod.h) return 'sq';
  const r = prod.w / prod.h;
  if(r < 0.85) return 'v';
  if(r > 1.25) return 'h';
  return 'sq';
}

function slotShape(slot){
  if(slot.rs > slot.cs) return 'v';
  if(slot.cs > slot.rs) return 'h';
  return 'sq';
}

function shapeMatch(prodShape, slotSh){
  if(prodShape === slotSh) return 4;
  if(prodShape === 'sq' || slotSh === 'sq') return 2;
  return 0;
}

/* Llena slots sin repetir fotos dentro de la misma página */
function fillSlotsCyclic(prods, slotCount, pageIndex){
  if(!prods.length || slotCount < 1) return [];
  const out = [];
  const start = (pageIndex * slotCount) % prods.length;
  const used = new Set();
  // Primera pasada: fotos distintas empezando desde offset
  for(let i = 0; i < prods.length && out.length < slotCount; i++){
    const p = prods[(start + i) % prods.length];
    if(!used.has(p.img)){ used.add(p.img); out.push(p); }
  }
  // Si faltan slots (mas slots que fotos), completar ciclando sin repetir en lo posible
  if(out.length < slotCount){
    for(let i = 0; out.length < slotCount; i++){
      out.push(prods[i % prods.length]);
    }
  }
  return out;
}

function layoutFitScore(group, layout){
  const slots = Object.entries(layout.tiles).map(([key, slot]) => ({ key, shape: slotShape(slot) }));
  const used = new Set();
  let score = 0;
  for(const slot of slots){
    let bestI = -1;
    let best = 0;
    group.forEach((prod, i) => {
      if(used.has(i)) return;
      const m = shapeMatch(shapeOf(prod), slot.shape);
      if(m > best){ best = m; bestI = i; }
    });
    if(bestI >= 0){ used.add(bestI); score += best; }
  }
  return score;
}

function pickLayoutForGroup(group, prevIdx){
  const src = isMobile() ? MOBILE_LAYOUTS : DESKTOP_LAYOUTS;
  let candidates = src.map((l, i) => ({ l, i })).filter(x => x.i !== prevIdx);
  if(!candidates.length) candidates = src.map((l, i) => ({ l, i }));

  const dualHero = candidates.filter(({ l }) => {
    const h2 = l.tiles.H2;
    return h2 && h2.cs >= 2 && h2.rs >= 2;
  });
  if(dualHero.length) candidates = dualHero;

  let chosen = candidates[0];
  let bestScore = -1;
  for(const c of candidates){
    const score = layoutFitScore(group, c.l);
    if(score > bestScore){ bestScore = score; chosen = c; }
  }
  return { layout: chosen.l, idx: chosen.i };
}

function assignProductsToSlots(products, layout){
  const slots = Object.entries(layout.tiles)
    .map(([key, slot]) => ({ key, slot, shape: slotShape(slot) }))
    .sort((a, b) => {
      const weight = s => (s.key === 'H' || s.key === 'H2' ? 100 : 0) + (s.shape === 'sq' ? 0 : s.shape === 'v' ? 2 : 3);
      return weight(b) - weight(a);
    });

  const available = [...products];
  const assignment = new Map();

  for(const { key, shape } of slots){
    if(!available.length) break;
    let bestI = 0;
    let best = -1;
    available.forEach((prod, i) => {
      const m = shapeMatch(shapeOf(prod), shape);
      if(m > best){ best = m; bestI = i; }
    });
    assignment.set(key, available[bestI]);
    available.splice(bestI, 1);
  }

  return { assignment, pool: available };
}

/* Toma slotCount fotos de la cola global sin repetir en la misma pantalla */
function takeFromCola(slotCount){
  const out = [];
  const used = new Set();
  let attempts = 0;
  while(out.length < slotCount && attempts < COLA.length * 2){
    const p = COLA.shift();
    attempts++;
    if(!p) break;
    if(!used.has(p.img)){
      used.add(p.img);
      out.push(p);
      COLA.push(p); // va al final de la cola
    } else {
      COLA.push(p); // devolver al final y seguir buscando
    }
  }
  return out;
}

function buildPages(prods){
  if(!prods.length) return [];

  // Inicializar cola aleatoria si está vacía
  if(!COLA.length) COLA = shuffleArr(prods);

  const pages = [];
  let prevIdx = -1;

  for(let p = 0; p < FIXED_PAGES; p++){
    const { layout, idx } = pickLayoutForGroup(prods, prevIdx);
    prevIdx = idx;

    const keys = Object.keys(layout.tiles);
    const candidates = takeFromCola(keys.length);
    const { assignment } = assignProductsToSlots(candidates, layout);
    const prodsOnScreen = keys.map(k => assignment.get(k) || null);

    pages.push({ layout, keys, prods: prodsOnScreen, pool: [...prods] });
  }
  return pages;
}

/* Espacios o (7) en el nombre rompen la URL si no se codifican */
function encodeImgPath(path){
  if(!path) return '';
  return path.split('/').map(part => encodeURIComponent(part)).join('/');
}
function imgCssUrl(path){
  const enc = encodeImgPath(path);
  return enc ? `url("${enc}")` : '';
}
/* Para HTML inline: sin comillas internas (si no, se rompe style="...") */
function bgStyle(prod){
  const enc = encodeImgPath(prod.img);
  return prod.img
    ? `background-image:url(${enc});background-color:${prod.bg || '#d4c9b8'}`
    : `background-color:${prod.bg || '#d4c9b8'}`;
}
function applyTileBg(el, prod){
  const enc = encodeImgPath(prod.img);
  el.style.backgroundImage = enc ? `url("${enc}")` : '';
  el.style.backgroundColor = prod.bg || '#d4c9b8';
  el.style.opacity = '1';
}

function setTileShapeClass(tile, prod){
  const hero = tile.classList.contains('tile-hero');
  tile.className = 'tile ' + (hero ? 'tile-hero' : 'tile-sm') + ' shape-' + shapeOf(prod);
}

function escapeHtml(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateTileProduct(tile, prod){
  if(!prod || !prod.img || !prod.imgOk){
    tile.className = 'tile tile-empty';
    tile.innerHTML = '';
    tile._prod = null;
    tile.onclick = null;
    return;
  }

  setTileShapeClass(tile, prod);
  tile._prod = prod;
  tile.onclick = () => openModal(tile._prod);

  let bg = tile.querySelector('.bg');
  if(!bg){
    const lblHtml = prod.showTitle
      ? `<div class="lbl"><span>${escapeHtml(prod.label)}</span><h3>${escapeHtml(prod.title)}</h3></div>`
      : '';
    tile.innerHTML = `<div class="bg"></div><div class="bg2"></div>${lblHtml}<div class="wa-tag">WhatsApp</div>`;
    applyTileBg(tile.querySelector('.bg'), prod);
    return;
  }

  applyTileBg(bg, prod);
  const h3 = tile.querySelector('.lbl h3');
  if(h3) h3.textContent = prod.title || '';
  const span = tile.querySelector('.lbl span');
  if(span) span.textContent = prod.label || '';
}

function tileLabelHtml(prod){
  if(!prod.showTitle) return '';
  return `<div class="lbl"><span>${escapeHtml(prod.label)}</span><h3>${escapeHtml(prod.title)}</h3></div>`;
}

function render(prods){
  stopAnimations();

  const wrap = document.getElementById('pwrap');
  wrap.innerHTML = '';
  wrap.className = 'pages-wrap';
  curPage = 0;
  pageTransBusy = false;

  if(!prods.length){
    wrap.innerHTML = '<div class="empty-msg">Sin resultados</div>';
    document.getElementById('dots').innerHTML = '';
    totalPages = 0;
    return;
  }

  const pages = buildPages(prods);
  totalPages = FIXED_PAGES;

  pages.forEach((pg, pi) => {
    const { layout, keys } = pg;
    const div = document.createElement('div');
    div.className = 'pg' + (pi === 0 ? ' is-active' : '');
    div.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
    div.style.gridTemplateRows = layout.rowTemplate || `repeat(${layout.rows}, minmax(0, 1fr))`;
    div.style.gridTemplateAreas = layout.areas;
    div._pool = pg.pool || [];

    keys.forEach((key, ki) => {
      const prod = pg.prods[ki];
      const t = document.createElement('div');
      t.style.gridArea = key;

      if(!prod || !prod.img || !prod.imgOk){
        t.className = 'tile tile-empty';
        div.appendChild(t);
        return;
      }

      t.className = 'tile ' + (isLargeSlot(layout, key) ? 'tile-hero' : 'tile-sm') + ' shape-' + shapeOf(prod);
      t.innerHTML = `<div class="bg"></div><div class="bg2"></div>${tileLabelHtml(prod)}<div class="wa-tag">WhatsApp</div>`;
      applyTileBg(t.querySelector('.bg'), prod);
      t._prod = prod;
      t.onclick = () => openModal(t._prod);
      div.appendChild(t);
    });

    wrap.appendChild(div);
  });

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for(let i = 0; i < FIXED_PAGES; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.onclick = () => { goPage(i); resetPageTimer(); };
    dotsEl.appendChild(d);
  }

  startWaAnim();
  startPageTimer();
  startFade();
}

function getVisiblePageEl(){
  const pages = document.querySelectorAll('.pg');
  return pages[curPage] || null;
}

function getPageFadePool(pageEl){
  const onTiles = [...pageEl.querySelectorAll('.tile:not(.tile-empty)')]
    .map(t => t._prod)
    .filter(p => p && p.imgOk);
  const extra = (pageEl._pool || []).filter(p => p && p.imgOk);
  const seen = new Set();
  const all = [...onTiles, ...extra];
  const pool = all.filter(p => {
    if(!p.img || !p.imgOk || seen.has(p.img)) return false;
    seen.add(p.img);
    return true;
  });
  if(pool.length >= 2) return pool;
  const global = PRODUCTOS.filter(p => p.imgOk);
  return global.length >= 2 ? global : pool;
}

function updateDots(){
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.className = 'dot' + (i === curPage ? ' on' : '');
  });
}

function goPage(n){
  const pgs = [...document.querySelectorAll('.pg')];
  if(!pgs.length || pageTransBusy) return;

  const next = ((n % pgs.length) + pgs.length) % pgs.length;
  if(next === curPage) return;

  const wrap = document.getElementById('pwrap');
  const mode = PAGE_TRANSITIONS[Math.floor(Math.random() * PAGE_TRANSITIONS.length)];
  wrap.className = 'pages-wrap tx-' + mode;

  const outPg = pgs[curPage];
  const inPg = pgs[next];

  pageTransBusy = true;
  clearFadeTimers();

  inPg.classList.add('is-active');
  outPg.classList.remove('is-active');
  outPg.classList.add('is-leaving');

  curPage = next;
  updateDots();

  clearTimeout(pageFadeRestartTimer);
  pageFadeRestartTimer = setTimeout(() => {
    outPg.classList.remove('is-leaving');
    pageTransBusy = false;
    startFade();
  }, PAGE_TRANS_MS);
}

function startPageTimer(){
  clearInterval(pageAnim);
  if(totalPages < 2) return;
  pageAnim = setInterval(() => goPage(curPage + 1), PAGE_AUTO_MS);
}

function resetPageTimer(){ startPageTimer(); }

function startWaAnim(){
  clearInterval(waAnim);
  waAnim = setInterval(() => {
    const page = getVisiblePageEl();
    if(!page) return;
    const tiles = [...page.querySelectorAll('.tile:not(.tile-empty)')];
    tiles.forEach(t => t.classList.remove('show-wa'));
    if(tiles.length){
      tiles[Math.floor(Math.random() * tiles.length)].classList.add('show-wa');
    }
  }, 3500);
}

function registerTileTimer(tile, id){
  const list = fadeTimersByTile.get(tile) || [];
  list.push(id);
  fadeTimersByTile.set(tile, list);
}

function clearFadeTimers(){
  fadeTimersByTile.forEach(ids => ids.forEach(clearTimeout));
  fadeTimersByTile.clear();
  simultaneousFades = 0;
}

function clearFadeTimersForTile(tile){
  const ids = fadeTimersByTile.get(tile);
  if(ids){
    ids.forEach(clearTimeout);
    fadeTimersByTile.delete(tile);
  }
}

function syncTileLabels(tile, prod){
  tile._prod = prod;
  tile.onclick = () => openModal(tile._prod);
  const h3 = tile.querySelector('.lbl h3');
  if(h3) h3.textContent = prod.title || '';
  const span = tile.querySelector('.lbl span');
  if(span) span.textContent = prod.label || '';
}

function startFade(){
  clearFadeTimers();
  simultaneousFades = 0;
  const visiblePage = getVisiblePageEl();
  if(!visiblePage) return;

  const pool = getPageFadePool(visiblePage);
  if(pool.length < 2) return;

  const tiles = shuffleArr([...visiblePage.querySelectorAll('.tile:not(.tile-empty)')]);
  tiles.forEach((tile, i) => {
    if(!tile.querySelector('.bg')) return;
    const firstAt = TILE_FADE_FIRST_MS + i * TILE_STAGGER_MS + Math.random() * 500;
    scheduleFadeForTile(tile, visiblePage, pool, firstAt);
  });
}

function scheduleFadeForTile(tile, pageEl, pool, customDelay){
  clearFadeTimersForTile(tile);

  const delay = customDelay !== undefined
    ? customDelay
    : (TILE_REST_MS + Math.random() * 3500);

  const t1 = setTimeout(() => {
    if(!tile.isConnected || getVisiblePageEl() !== pageEl || pageTransBusy) return;

    if(simultaneousFades >= MAX_SIMULTANEOUS_FADES){
      scheduleFadeForTile(tile, pageEl, pool, 1400);
      return;
    }

    const current = tile._prod;
    let next = pool[Math.floor(Math.random() * pool.length)];
    let guard = 0;
    while(pool.length > 1 && current && next.img === current.img && guard < 16){
      next = pool[Math.floor(Math.random() * pool.length)];
      guard++;
    }

    const bg = tile.querySelector('.bg');
    const bg2 = tile.querySelector('.bg2');
    if(!bg || !bg2 || !next || !next.img) return;

    simultaneousFades++;
    applyTileBg(bg2, next);
    setTileShapeClass(tile, next);
    bg2.style.opacity = '0';
    bg.style.transition = `opacity ${TILE_FADE_MS}ms ease`;
    bg2.style.transition = `opacity ${TILE_FADE_MS}ms ease`;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      bg2.style.opacity = '1';
      bg.style.opacity = '0';
    }));

    const t2 = setTimeout(() => {
      if(!tile.isConnected || getVisiblePageEl() !== pageEl) return;
      applyTileBg(bg, next);
      syncTileLabels(tile, next);
      bg.style.opacity = '1';
      bg2.style.opacity = '0';
      bg2.style.backgroundImage = '';
      simultaneousFades = Math.max(0, simultaneousFades - 1);
      scheduleFadeForTile(tile, pageEl, pool);
    }, TILE_FADE_MS + 80);
    registerTileTimer(tile, t2);
  }, delay);

  registerTileTimer(tile, t1);
}

function stopAnimations(){
  clearInterval(pageAnim);
  clearInterval(waAnim);
  clearTimeout(pageFadeRestartTimer);
  clearFadeTimers();
}

let sx = 0, sy = 0;
document.getElementById('canvas').addEventListener('touchstart', e => {
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
}, { passive: true });
document.getElementById('canvas').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = Math.abs(e.changedTouches[0].clientY - sy);
  if(dy > Math.abs(dx)) return;
  if(Math.abs(dx) > 40){
    goPage(dx < 0 ? curPage + 1 : curPage - 1);
    resetPageTimer();
  }
}, { passive: true });

function toggleSearch(){
  const bar = document.getElementById('searchBar');
  bar.classList.toggle('open');
  if(bar.classList.contains('open')){
    setTimeout(() => document.getElementById('searchInput').focus(), 50);
  } else {
    closeSearch();
  }
}

function closeSearch(){
  document.getElementById('searchBar').classList.remove('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
}

function highlight(text, q){
  if(!q) return text || '';
  const safeText = String(text || '');
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return safeText.replace(re, '<span class="sr-highlight">$1</span>');
}

function onSearch(q){
  const rs = document.getElementById('searchResults');
  q = String(q || '').trim();
  if(!q){ rs.innerHTML = ''; return; }

  const ql = q.toLowerCase();
  const matches = PRODUCTOS.filter(p => {
    const title = (p.title || '').toLowerCase();
    const desc = (p.desc || '').toLowerCase();
    const label = (p.label || '').toLowerCase();
    return title.includes(ql) || desc.includes(ql) || label.includes(ql);
  }).slice(0, 8);

  if(!matches.length){
    rs.innerHTML = '<div class="sr-empty">Sin resultados</div>';
    return;
  }

  rs.innerHTML = matches.map(p => {
    const idx = PRODUCTOS.indexOf(p);
    const enc = encodeImgPath(p.img);
    const bg = p.img
      ? `background-image:url(${enc});background-color:${p.bg || '#d4c9b8'}`
      : `background-color:${p.bg || '#d4c9b8'}`;
    return `<div class="sr-item" onclick="pickResult(${idx})"><div class="sr-swatch" style="${bg}"></div><div class="sr-info"><div class="sr-name">${highlight(p.title, q)}</div><div class="sr-cat">${p.label || 'Colección'}</div></div></div>`;
  }).join('');
}

function pickResult(idx){
  if(idx < 0 || idx >= PRODUCTOS.length) return;
  closeSearch();
  openModal(PRODUCTOS[idx]);
}

function openModal(prod){
  if(!prod) return;
  stopAnimations();
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('show-wa'));

  const mb = document.getElementById('mimg-bg');
  mb.style.backgroundImage = prod.img ? imgCssUrl(prod.img) : '';
  mb.style.backgroundColor = prod.bg || '#d4c9b8';
  document.getElementById('mcat').textContent = prod.label || '';
  document.getElementById('mtitle').textContent = prod.title || '';
  document.getElementById('mdesc').textContent = prod.desc || '';
  const msg = encodeURIComponent(`Hola Pelusitas! Me interesa: ${prod.title || ''}`);
  document.getElementById('wa-link').href = `https://wa.me/${WA_NUMBER}?text=${msg}`;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  startWaAnim();
  startPageTimer();
  startFade();
}

(function(){
  const c = document.getElementById('stars');
  if(!c) return;
  for(let i = 0; i < 60; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.appendChild(s);
  }
})();

function fixUtf8Mojibake(str){
  if(!str || typeof str !== 'string') return str || '';
  if(!/Ã|Â|\uFFFD/.test(str)) return str;
  try{
    const bytes = Uint8Array.from([...str], ch => ch.charCodeAt(0) & 0xff);
    const fixed = new TextDecoder('utf-8').decode(bytes);
    if(fixed && !fixed.includes('\uFFFD')) return fixed;
  }catch(e){}
  try{
    return decodeURIComponent(escape(str));
  }catch(e){}
  return str;
}

function normalizar(item){
  return {
    label: fixUtf8Mojibake(item?.label) || 'Colección',
    title: fixUtf8Mojibake(item?.title) || '',
    desc: fixUtf8Mojibake(item?.desc) || '',
    img: (item?.img || '').trim(),
    bg: item?.bg || '#d4c9b8',
    showTitle: !!item?.showTitle,
    w: item?.w || 0,
    h: item?.h || 0,
    imgOk: false
  };
}

function measureImg(url){
  return new Promise(res => {
    if(!url){ res({ w: 0, h: 0 }); return; }
    const img = new Image();
    let settled = false;
    const finish = v => {
      if(settled) return;
      settled = true;
      res(v);
    };
    img.onload = () => finish({ w: img.naturalWidth || 0, h: img.naturalHeight || 0 });
    img.onerror = () => finish({ w: 0, h: 0 });
    setTimeout(() => finish({ w: 0, h: 0 }), 4000);
    img.src = encodeImgPath(url);
  });
}

async function init(){
  try{
    const res = await fetch(`${CATALOGO_URL}?v=${Date.now()}`);
    if(!res.ok) throw new Error(res.status);
    const raw = await res.text();
    const data = JSON.parse(raw);
    PRODUCTOS = (Array.isArray(data) ? data : []).map(normalizar);
  }catch(e){
    console.warn('No se pudo cargar el catálogo:', e);
    document.getElementById('pwrap').innerHTML = '<div class="empty-msg" style="flex-direction:column;gap:.8rem"><span>No se pudo cargar el catálogo</span><span style="font-size:9px;opacity:.6">Verificá la conexión o el archivo catalogo.json</span></div>';
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  await Promise.all(PRODUCTOS.map(async p => {
    const { w, h } = await measureImg(p.img);
    p.w = w;
    p.h = h;
    p.imgOk = !!(p.img && w > 0 && h > 0);
  }));

  const paraGrilla = PRODUCTOS.filter(p => p.imgOk);
  if(!paraGrilla.length){
    document.getElementById('pwrap').innerHTML = '<div class="empty-msg" style="flex-direction:column;gap:.8rem"><span>Sin fotos válidas en el catálogo</span><span style="font-size:9px;opacity:.6">Revisá las rutas img en catalogo.json</span></div>';
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  const loader = document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 400);
  render(paraGrilla);
}

init();

// Wake Lock: evita que la pantalla se apague mientras se navega el sitio
if('wakeLock' in navigator){
  const requestWakeLock = async () => {
    try{ await navigator.wakeLock.request('screen'); }catch(e){}
  };
  requestWakeLock();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') requestWakeLock(); });
}
